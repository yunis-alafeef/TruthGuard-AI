# TruthGuard AI

TruthGuard AI هو تطبيق صغير للتدقيق في المعلومات والادعاءات، ويهدف إلى مساعدة المستخدم على التحقق من أي معلومة قبل تصديقها أو مشاركتها. يلتقط التطبيق الادعاء الرئيسي، يبحث في المصادر العامة، ويقارن بين الدليل والأدلة المتعارضة ثم يقدّم نتيجة واضحة مدعومة بالشفافية.

![معاينة الموقع](docs/truthguard-preview.svg)

## لمحة سريعة

- يدعم نتائج متعددة: مدعوم، على الأرجح صحيح، غير موثق، مضلل، أو مزيف.
- يركز على مصادر مفتوحة وأدلة قابلة للتتبع.
- يوظف نموذجًا يدعم التقييم لكنه لا يحل محل الحكم البشاري.
- يبقي سجل التحقق محليًا داخل التطبيق.

## المشكلة

تنتشر المعلومات الخاطئة والمضللة بسرعة أكبر من مراجعة صحتها. يحتاج المستخدمون إلى نقطة بداية سريعة قبل مشاركة أي خبر أو ادعاء. لذلك تم تصميم TruthGuard AI ليكون أول خطوة عملية في عملية التحقق، لا حكمًا نهائيًا.

## كيف يعمل الوكيل

1. الفهم: يقوم بتصفية الرسالة أو العنوان واستنباط الادعاء الرئيسي.
2. التحقيق: يبحث في الويب العام عن أدلة داعمة أو معارضة.
3. التصنيف: يستدعي خدمة FastAPI في المسار `/predict`.
4. الدمج: يقارن بين إشارة النموذج والإشارات المستخلصة من البحث.
5. التفسير: يعرض النتيجة، درجة الثقة، الشرح، والأدلة.
6. التذكر: يحفظ كل تحقق في قاعدة SQLite محلية حتى يظهر في قسم السجل.

يُعطى وزن أكبر للأدلة والبحث الحالي، بينما يُعدّ النموذج إشارة إضافية لا أكثر. هذا يجعل النظام أكثر شفافية وأقل اعتمادًا على التقديرات وحدها.

## بنية المشروع

```text
React + TypeScript + Vite
        |
        | /api/verify, /api/history, /api/model/metrics
        v
Node.js API server
  - تطبيع الادعاء
  - البحث عن الأدلة
  - شرح النتيجة
  - سجل SQLite
        |
        | POST /predict
        v
Python FastAPI ML service
  - TF-IDF
  - Logistic Regression
  - نموذج joblib محفوظ
```

## الجهة التدريبية والنموذج

خدمة التدريب تستخدم مجموعة البيانات العامة LIAR، وهي مجموعة معيارية للتصنيف في الأخبار الزائفة والادعاءات السياسية. يقرأ الملف `services/ml_service/train.py` البيانات العامة، ويقوم بمهام مثل:

- تنزيل ملفات التدريب والتقييم عند توفرها.
- الاحتفاظ بتقسيم التحقق الأصلي بشكل منفصل.
- استخدام تقسيم 80/20 متوازن عند توفر البيانات.
- تدريب ناقل TF-IDF مع أحادية وثنائية الكلمات.
- تدريب مصنف Logistic Regression متوازن.
- حفظ `model.joblib` و `metrics.json`.
- حساب الدقة و Precision و Recall و F1 بطريقة macro.

يتم تضمين ملفات النموذج الناتجة بعد أول تدريب. إذا كان التنزيل العام غير متاح، يستخدم المشروع مجموعة بيانات بديلة صغيرة وشفافة حتى يظل النظام يعمل بشكل مستقر.

## تشغيل المشروع محليًا

المتطلبات:

- Node.js 24
- pnpm
- Python 3.13

### 1) تثبيت التبعيات

```bash
pnpm install
pnpm --filter @workspace/api-spec run codegen
python3 -m services.ml_service.train
```

### 2) تشغيل الخدمات

```bash
pnpm --filter @workspace/api-server run dev
pnpm --filter @workspace/truthguard-ai run dev
```

### 3) التحقق من الخوادم

```bash
curl http://localhost:5000/api/healthz
curl http://localhost:5000/api/model/metrics
```

### 4) التشغيل الاختباري

```bash
pnpm run typecheck
pnpm --filter @workspace/truthguard-ai run build
python3 -m py_compile services/ml_service/app.py services/ml_service/train.py
```

## التقنيات المستخدمة

- React + TypeScript + Vite
- Tailwind CSS + Wouter + TanStack Query
- خادم API في Node.js مع Express 5
- Python + FastAPI + scikit-learn + joblib
- SQLite عبر `node:sqlite`
- DuckDuckGo للبحث العام والبحث عن الأدلة الحالية

## القيود والمعضلات

- لا تُعدّ snippets البحثية نفس المقالات الأصلية؛ يفضل فتح الروابط ومراجعة المصدر الكامل.
- قد تتأثر النتائج بسبب التغييرات في الفهرسة وسرعة البحث والحدود التطبيقية.
- النموذ�� لا يُعتبر مصدرًا نهائيًا للحقيقة.
- مجموعة LIAR تركز على بيانات سياسية قصيرة، لذلك لا تغطي كل المواضيع أو اللغات أو الأساليب.
- الثقة المرتفعة أو المنخفضة لا تُثبت أو تنفي ادعاءً بشكل قاطع.
- لا يوجد نظام مصادقة، والسجل المحلي محفوظ فقط على الخدمة الحالية.

## الهوية البصرية

- الاسم: TruthGuard AI
- الشعار: لا تصدق فقط… تحقق.
- المؤلف: المهندس يونس العفيف

