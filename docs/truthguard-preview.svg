## الترخيص

المشروع متاح للمشاركة والتجربة من خلال هذا المستودع، مع الإشارة إلى الاسم والمالك عند الاستخدام أو التعديل.

## الخلاصة

TruthGuard AI ليس تقويمًا نهائيًا للحقيقة، بل أداة عملية للمراجعة والتدقيق تساعد المستخدم على التوقف، فكّ الادعاء، ومقارنة الأدلة قبل الثقة أو النشر.

