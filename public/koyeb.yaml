# Koyeb Deployment Configuration for TruthGuard AI
# Documentation: https://www.koyeb.com/docs/reference/koyeb-yaml

name: truthguard-ai
services:
  - name: truthguard-web
    type: web
    regions:
      - fra # Frankfurt, Europe (Fastest latency for MENA / Middle East)
    instance_type: eco
    docker:
      dockerfile: Dockerfile
    ports:
      - port: 3000
        path: /
        protocol: http
    routes:
      - path: /
        port: 3000
    health_checks:
      - http:
          path: /api/health
          port: 3000
        interval: 30
        timeout: 5
        unhealthy_threshold: 3
        healthy_threshold: 1
    env:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: GEMINI_API_KEY
        secret: gemini-api-key # Link this in Koyeb Secrets UI
